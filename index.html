下，没有必须打卡的终点。",amenities:["大蜀山森林公园：市区里唯一的一座山，台阶路四十分钟就能登顶，山顶能看整座城市的天际线；下山顺路逛山脚下的半边街，奶茶小吃都有","逍遥津公园：合肥人从小逛到大的老牌公园，逍遥湖可以划船，湖上踩一圈脚踏船，还有摩天轮和碰碰车，想动想静都行","包公园：包公祠和清风阁连成的一片开放式园林，沿水慢慢走、亭台水榭都不错，是几个选项里节奏最缓的一个","翡翠湖公园：大学城旁边的大草坪和湖，人不多，适合放风筝、坐在草地上聊天，傍晚看日落也很漂亮"],ctaText:"",ctaHref:""},{name:"坐",price:"",frequency:"",journeys:"找个地方坐下来",image:"images/cafe.jpg",description:"走了半天总要有个落脚点。这一趴的原则就三条：环境放松、坐得住、说话不用扯着嗓子。比起商场里嘈杂的连锁饮品店，下面这些「坐下来就不想走」的地方更合适，一杯喝的能聊上很久。",amenities:["红星路咖啡一条街：一条老街上挤了十几家独立咖啡馆，看哪家顺眼进哪家；这条街本身就适合慢慢逛，店门口都布置得很出片","猫咖：猫咪是现成的聊天素材，边撸猫边喝茶，尴尬什么的根本不存在；去之前在点评软件上挑评分高、猫多的店，记得先问一句对猫毛过不过敏","DIY 手作店：拼豆、香薰蜡烛、银饰、陶艺都行，两人一起做点什么，比干坐着话多得多；拼豆和蜡烛当场能带走，等于顺手做了个见面纪念品","卡旺卡配詹记桃酥：合肥本地的奶茶配本地糕点，买上边走边吃，也算打卡了合肥味道，不想久坐的时候选这个"],ctaText:"",ctaHref:""},{name:"吃",price:"",frequency:"",journeys:"吃点合肥特色",image:"images/leijie.jpg",description:"合肥人对吃的自信，都藏在小街小巷里。下面几个选项风格完全不同：想边走边吃就去小吃街，想坐下来正经吃一顿就选本地菜馆，想感受夜市氛围就等天黑了去。按当时的胃口和体力挑一个就行，都是本地学生常去、基本不踩雷的地方。",amenities:["官亭路小吃街：农大旁边的学生食堂级小吃街，烤猪蹄、犁大爷粑粑、辣哭饼一路吃过去，人均不贵，从头吃到尾也就逛完一条街的时间","庐州太太：合肥老牌本地菜馆，好几家分店，臭鳜鱼、李鸿章大杂烩、脆皮茄子是招牌，便宜大碗，人多热闹，饭点要排队","罍街：徽派建筑群里的一条美食街，三河米饺、吴山贡鹅都值得试，天黑灯亮之后氛围最好，吃完还能接着逛","宁国路龙虾一条街：紧挨着罍街，夏天的尾巴还能赶上吃龙虾的尾声，大排档坐成一片，烟火气十足"],ctaText:"",ctaHref:""},{name:"拍照",price:"",frequency:"",journeys:"留几张今天的照片",image:"images/hechai.jpg",description:"不管是随手拍还是认真找机位，这一天总该留下几张照片。下面这些属于「随手按快门都好看」的地方，互相当一回摄影师，也是这天里很有意思的环节。技术好不好没关系，拍糊了也算纪念。",amenities:["合柴1972：老监狱改的文创园，红砖厂房、涂鸦墙、老岗楼，工业风里带一点复古，园区里走两步就是一个机位，下午四点之后光线最柔","天鹅湖公园：观景平台正对着 CBD 天际线，日落前一小时整个湖面都是橘色的，是这座城市最拿得出手的一张照片","罍街夜景：天黑之后灯牌一盏盏亮起来，错落的光特别有烟火气，适合拍夜景人像","红星路街拍：老巷子、旧门脸配胶片感的滤镜，又是另一种味道，拍完正好在咖啡馆坐下歇脚"],ctaText:"",ctaHref:""}]},Vo={ageGateText:"这份单子随时能改，商量着来就好。",brandName:"初见行程单",brandTaglineLines:["走一程，坐一会儿，吃点好的，拍几张照片","两个人一起看，挑中的打钩，剩下的见面再定"],columns:[{heading:"四个部分",links:[{label:"走",href:"#tiers"},{label:"坐",href:"#tiers"},{label:"吃",href:"#tiers"},{label:"拍照",href:"#tiers"}]},{heading:"补充信息",links:[{label:"计划说明",href:"#manifesto"},{label:"小贴士",href:"#anatomy"},{label:"回到顶部",href:"#hero"}]}],copyright:"2026 秋季 · 合肥"};functi
